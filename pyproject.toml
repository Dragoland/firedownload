[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firedownload"
dynamic = ["version"]
description = "Gestor de descargas de vídeo y audio basado en yt-dlp, con interfaz PySide6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dragoland", email = "norland.chavez333@gmail.com" }]
dependencies = ["PySide6>=6.6", "yt-dlp[default]>=2025.11.12", "psutil>=5.9"]

[project.urls]
Homepage = "https://bitcriollo.pages.dev"
Repository = "https://github.com/Dragoland/firedownload"

[project.gui-scripts]
firedownload = "firedownload.app:main"

[tool.setuptools.dynamic]
version = { attr = "firedownload.__version__" }

[tool.setuptools.packages.find]
include = ["firedownload*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
